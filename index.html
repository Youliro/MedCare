<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A9F8C">
<title>MedCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4A9F8C; --primary-dark:#2F7D6B; --mint:#BDF5D9; --mint-soft:#E4FBEF;
  --text:#2E2E2E; --muted:#8A8A8A; --border:#D6D6D6; --bg:#FFFFFF; --page:#EEF3F1;
  --danger:#D9534F; --warn:#E8A33D; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--page);color:var(--text);-webkit-font-smoothing:antialiased}
body.big-text{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
:focus-visible{outline:3px solid #2F7D6B;outline-offset:2px}

/* phone frame on desktop, full screen on mobile */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.phone{position:relative;width:390px;height:844px;background:var(--bg);border-radius:48px;overflow:hidden;
  box-shadow:0 0 0 12px #1c1c1e,0 0 0 14px #6b6470,0 30px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:50}
@media (max-width:500px){
  .stage{padding:0;align-items:stretch}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  .notch{display:none}
}
.screen{flex:1;overflow-y:auto;padding:58px 20px 24px;scroll-behavior:smooth}
@media (max-width:500px){.screen{padding-top:calc(env(safe-area-inset-top) + 18px)}}
.screen::-webkit-scrollbar{width:0}

/* nav */
.tabbar{display:flex;justify-content:space-around;border-top:1px solid #eee;padding:8px 6px calc(10px + env(safe-area-inset-bottom));background:#fff}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 8px;border-radius:10px;min-width:58px}
.tabbar button.active{color:var(--primary-dark);font-weight:600}
.tabbar button.active svg{stroke:var(--primary-dark)}

/* type */
.title-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.title-row h1{font-size:26px;font-weight:700;color:#3d3d3d}
.back{color:var(--primary);width:32px;height:32px;display:grid;place-items:center;border-radius:10px;margin-left:-8px}
.back:hover{background:var(--mint-soft)}
h2{font-size:19px;font-weight:600;color:#3a3a3a;margin:22px 0 12px}
.muted{color:var(--muted)}
.small{font-size:12px}
.teal{color:var(--primary-dark)}

/* form */
label.f{display:block;font-size:13px;font-weight:500;color:#666;margin:16px 0 6px}
.input{width:100%;border:1px solid var(--border);border-radius:10px;padding:13px 14px;font-size:14px;background:#fff;outline:none;transition:border .15s}
.input:focus{border-color:var(--primary)}
.input.err{border-color:var(--danger)}
.err-msg{color:var(--danger);font-size:12px;margin-top:6px;min-height:0}
textarea.input{resize:vertical;min-height:80px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);stroke:#777}
.search .input{padding-left:40px}

.btn{width:100%;padding:14px;border-radius:10px;font-size:17px;font-weight:600;transition:transform .05s,filter .15s}
.btn:active{transform:scale(.99)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{filter:brightness(.95)}
.btn-primary:disabled{background:#a9cfc6;cursor:not-allowed}
.btn-outline{border:1px solid var(--border);color:var(--primary);background:#fff}
.btn-danger{background:#fff;border:1px solid var(--danger);color:var(--danger)}
.btn-sm{width:auto;padding:9px 14px;font-size:14px;border-radius:10px}
.link{color:var(--primary);font-size:12px;font-weight:600}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:14px 0 4px}
.chips::-webkit-scrollbar{height:0}
.chip{flex:none;padding:9px 16px;border-radius:9px;background:var(--mint);color:var(--primary-dark);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--primary);color:#fff}
.chip.outline{background:#fff;border:1px solid var(--primary);padding:5px 12px;font-size:12px;border-radius:8px}
.chip.outline.on{background:var(--primary);color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.seg .chip{text-align:center}

/* cards */
.card{border:1px solid #cfcfcf;border-radius:var(--radius);padding:14px;background:#fff;margin-bottom:14px;display:block;width:100%;text-align:left}
button.card:hover,.card.clickable:hover{border-color:var(--primary);cursor:pointer}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ava{flex:none;width:52px;height:52px;border-radius:50%;background:var(--mint);display:grid;place-items:center;color:var(--primary-dark);font-weight:700}
.ava.sq{border-radius:16px;width:64px;height:64px}
.badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--mint);color:var(--primary-dark);white-space:nowrap}
.badge.grey{background:#eee;color:#777}
.badge.warn{background:#FCEBD0;color:#9a6512}
.badge.red{background:#fbe0df;color:#a33}
.dot{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--primary);color:#fff;font-size:10px;font-weight:700;padding:0 5px}
.mint-hero{background:var(--mint);border-radius:18px;padding:18px;display:flex;align-items:center;gap:16px}
.mint-hero .circle{width:76px;height:76px;border-radius:50%;background:rgba(74,159,140,.15);display:grid;place-items:center;flex:none}
.mint-hero h3{font-size:16px;color:#2c5a4f}
.mint-hero p{font-size:12px;color:#4d7d71;margin-top:4px}

/* login */
.logo{width:72px;height:72px;border-radius:18px;background:var(--mint);display:grid;place-items:center;margin:20px auto 8px}
.brand{text-align:center;font-size:30px;font-weight:800;color:var(--primary)}
.tagline{text-align:center;font-size:12px;color:#777;font-weight:500;margin-top:2px}

/* dashboard */
.greet{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.greet small{color:#777;font-size:14px;font-weight:500}
.greet .name{font-size:24px;font-weight:500;color:#111;margin-top:2px}
.ava-btn{width:58px;height:58px;border-radius:16px;background:var(--mint);display:grid;place-items:center}
.services{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc{background:var(--mint);border-radius:6px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;color:#2c4b44;transition:filter .15s}
.svc:hover{filter:brightness(.96)}
.svc.center{grid-column:1 / -1;justify-self:center;width:calc(50% - 6px)}

/* doctor slots */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.slot{background:var(--mint);border-radius:6px;padding:8px 0;font-size:12px;font-weight:500;color:var(--primary-dark);text-align:center}
.slot.on{background:var(--primary);color:#fff}
.slot:disabled{background:#f1f1f1;color:#bbb;text-decoration:line-through;cursor:not-allowed}
.days{display:flex;gap:8px;overflow-x:auto;margin:10px 0}
.days::-webkit-scrollbar{height:0}
.day{flex:none;width:56px;padding:8px 0;border-radius:12px;border:1px solid var(--border);text-align:center;font-size:12px}
.day b{display:block;font-size:17px;margin-top:2px}
.day.on{background:var(--primary);border-color:var(--primary);color:#fff}

/* chat */
.thread{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.msg{max-width:78%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.doc{align-self:flex-start;background:#f1f4f3;border-bottom-left-radius:4px}
.msg time{display:block;font-size:10px;opacity:.7;margin-top:3px;text-align:right}
.composer{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #eee;background:#fff}
.composer .input{border-radius:22px;padding:11px 16px}
.send{width:44px;height:44px;border-radius:50%;background:var(--primary);display:grid;place-items:center;flex:none}
.typing{align-self:flex-start;font-size:12px;color:var(--muted);padding:4px 6px}
.chat-head{display:flex;align-items:center;gap:10px;padding:52px 14px 12px;border-bottom:1px solid #eee}
@media (max-width:500px){.chat-head{padding-top:calc(env(safe-area-inset-top) + 12px)}}

/* list menu */
.menu{border:1px solid #ddd;border-radius:var(--radius);overflow:hidden}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:15px 14px;border-bottom:1px solid #eee;font-size:14px;text-align:left}
.menu button:last-child{border-bottom:none}
.menu button:hover{background:var(--mint-soft)}

/* sheet + toast */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:#fff;width:100%;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.sheet .grab{width:40px;height:5px;background:#ddd;border-radius:3px;margin:0 auto 14px}
.sheet h3{font-size:19px;margin-bottom:4px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px;gap:12px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:500}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#263f39;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;z-index:80;max-width:85%;text-align:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
table.lab{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.lab td,table.lab th{padding:8px 4px;border-bottom:1px solid #f0f0f0;text-align:left}
table.lab th{color:var(--muted);font-weight:500}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.switch{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee;font-size:14px}
.switch input{width:44px;height:24px;accent-color:var(--primary)}
details{border:1px solid #e3e3e3;border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14px}
details summary{font-weight:600;cursor:pointer}
details p{margin-top:8px;color:#555;line-height:1.5}
.banner{border-radius:16px;overflow:hidden;background:var(--mint)}
.success-ic{width:90px;height:90px;border-radius:50%;background:var(--mint);display:grid;place-items:center;margin:40px auto 18px}
</style>
</head>
<body>
<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div id="app" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></div></div>

<script>
/* ============ ICONS ============ */
const IC = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  chev:'<path d="M9 18l6-6-6-6"/>',
  home:'<path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  homeplus:'<path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M12 10v6M9 13h6"/>',
  file:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  pill:'<path d="M10.5 20.5a4.95 4.95 0 0 1-7-7l9-9a4.95 4.95 0 0 1 7 7z"/><path d="M8.5 8.5l7 7"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/>',
  ask:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/><path d="M10 9.5a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2M12 15.5h.01"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  usercircle:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.2 18.4a6.5 6.5 0 0 1 11.6 0"/>',
  stetho:'<path d="M5 3v5a5 5 0 0 0 10 0V3"/><path d="M10 13v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="2"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/>',
  logout:'<path d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4M16 17l5-5-5-5M21 12H9"/>',
  flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3M7.5 14h9"/>',
  send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
  heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  star:'<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
  pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9.5h.01M15 9.5h.01"/>',
  rx:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  hands:'<path d="M2 14l4-1 5 3h4a1.5 1.5 0 0 1 0 3H9M2 20l3-1 7 2 8-5a1.5 1.5 0 0 0-2-2l-4 2"/><path d="M12 3v6M9 6h6"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
};
const icon = (n, s=22, c='currentColor', w=1.8) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;

/* ============ HELPERS ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const parseDay = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtDay = k => { const d = parseDay(k); return `${pad(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const fmtShort = k => { const d = parseDay(k); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtTime = t => { let [h,m] = t.split(':').map(Number); const ap = h>=12?'PM':'AM'; h = h%12||12; return `${pad(h)}:${pad(m)} ${ap}`; };
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const today = () => dayKey(new Date());
const uid = () => Math.random().toString(36).slice(2,10);
const hash = s => { let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const initials = n => n.replace(/^Dr\.\s*/,'').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const relDay = k => k===today() ? 'Today' : k===dayKey(addDays(new Date(),1)) ? 'Tomorrow' : k===dayKey(addDays(new Date(),-1)) ? 'Yesterday' : fmtShort(k);

/* ============ STATIC DATA ============ */
const DOCTORS = [
  {id:'zia', name:'Dr. Zia Al K', spec:'Cardiologist', cat:'Cardiology', exp:12, rating:4.9, clinic:'MedCare Heart Center, Astana', fee:'12 000 ₸', about:'Specialist in hypertension, arrhythmia and preventive cardiology.'},
  {id:'yildar', name:'Dr. Yildar', spec:'Dentist', cat:'Dentistry', exp:8, rating:4.8, clinic:'MedCare Dental, Astana', fee:'9 000 ₸', about:'General and cosmetic dentistry, check-ups and cleaning.'},
  {id:'abuali', name:'Dr. Skak Abuali', spec:'Psychologist', cat:'Psychology', exp:10, rating:4.9, clinic:'MedCare Wellbeing, Astana', fee:'10 000 ₸', about:'Stress, anxiety and sleep problems. Online and in-person sessions.'},
  {id:'tamerlan', name:'Dr. Tamerlan Bodoh', spec:'General Physician', cat:'General', exp:15, rating:4.7, clinic:'MedCare Clinic No. 1, Astana', fee:'7 000 ₸', about:'Annual check-ups, common illnesses and referrals to specialists.'},
  {id:'dudung', name:'Dr. Dudung', spec:'Neurologist', cat:'Neurology', exp:11, rating:4.6, clinic:'MedCare Neuro, Astana', fee:'11 000 ₸', about:'Headaches, migraines, dizziness and nerve pain.'},
  {id:'prabowo', name:'Dr. Prabowo', spec:'Therapist', cat:'General', exp:9, rating:4.7, clinic:'MedCare Clinic No. 2, Astana', fee:'7 500 ₸', about:'Internal medicine and chronic disease follow-up.'},
  {id:'subianto', name:'Dr. Subianto', spec:'Gastroenterologist', cat:'General', exp:13, rating:4.8, clinic:'MedCare Clinic No. 1, Astana', fee:'11 500 ₸', about:'Digestive health, nutrition and stomach pain.'},
  {id:'bahlil', name:'Dr. Bahlil', spec:'Pediatrician', cat:'Pediatrics', exp:7, rating:4.9, clinic:'MedCare Kids, Astana', fee:'8 000 ₸', about:'Care for children from birth to 18, vaccinations.'},
];
const CATS = ['All','Cardiology','Dentistry','Psychology','Neurology','General','Pediatrics'];
const TIMES = ['09:00','10:00','11:30','12:00','14:00','15:30','17:00'];
const doc = id => DOCTORS.find(d => d.id === id);

/* ============ STORE (localStorage) ============ */
const KEY = 'medcare_v1';
let S;
function load(){
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) { S = null; }
  if (!S || !S.users) S = freshStore();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function freshStore(){
  // Demo account — prototype only, passwords are not hashed.
  const demo = {id:'u1', name:'Rusdi Ngawi', phone:'77771243284', iin:'990101300123', password:'medcare123',
    birth:'1999-01-01', blood:'A (II) Rh+', allergies:'Penicillin', address:'Astana, Mangilik El 55'};
  return {users:[demo], session:null, data:{u1:seedData()}, settings:{big:false, notif:true}};
}
function seedData(){
  const t = new Date();
  const d = n => dayKey(addDays(t,n));
  const ago = (n,h,m) => { const x = addDays(t,-n); x.setHours(h,m,0,0); return x.getTime(); };
  const at = (h,m) => { const x = new Date(); x.setHours(h,m,0,0); return Math.min(x.getTime(), Date.now()-60000); };
  return {
    bookings:[
      {id:uid(), doctorId:'abuali', date:d(1), time:'10:00', status:'booked', reason:'Follow-up session'},
      {id:uid(), doctorId:'tamerlan', date:d(1), time:'12:00', status:'booked', reason:'Annual check-up'},
    ],

  const [path, qs] = h.split('?');
  const parts = path.split('/');
  return {name:parts[0], id:parts[1], q:new URLSearchParams(qs||'')};
}

function normalizeId(v){
  const s = v.replace(/[\s\-()]/g,'');
  if (/^\d{12}$/.test(s)) return {iin:s};
  let p = s.replace(/^\+/,'');
  if (/^8\d{10}$/.test(p)) p = '7'+p.slice(1);
  if (/^7\d{10}$/.test(p)) return {phone:p};
  return null;
}

/* ============ S3 FIND A DOCTOR ============ */
function slotState(docId, day, time){
  const n = today();
  if (day < n || (day === n && time <= nowHM())) return 'past';
  for (const uidKey of Object.keys(S.data)) {
    if (S.data[uidKey].bookings.some(b => b.status==='booked' && b.doctorId===docId && b.date===day && b.time===time))
      return uidKey === S.session ? 'mine' : 'busy';
  }
  if (hash(docId+day+time) % 4 === 0) return 'busy'; // simulated other patients
  return 'free';
}
function freeSlots(docId, day){ return TIMES.filter(t => slotState(docId, day, t) === 'free'); }
function firstDayWithSlots(docId){ for (let i=0;i<14;i++){ const k = dayKey(addDays(new Date(),i)); if (freeSlots(docId,k).length) return k; } return today(); }

let pick = {doc:null, day:null, time:null};

    <div style="margin-top:12px">${list.length ? list.map(docCard).join('') : `<div class="empty">No doctors found${q?` for “${esc(q)}”`:''}.</div>`}</div>
  `};
};
function docCard(d){

/* ============ S7 MEDICATION ============ */
const takenKey = (m, day, t) => `${m.id}|${day}|${t}`;
function nextDose(){
  const meds = D().meds.filter(m=>m.status==='current');
  const n = nowHM(), k = today(), tm = dayKey(addDays(new Date(),1));
  let best = null;
  for (const m of meds) for (const [day, after] of [[k, n],[tm, '']]) {
    if (day > m.end || day < m.start) continue;
    for (const t of m.times) { if (t <= after && day===k) continue; if (D().taken[takenKey(m,day,t)]) continue;
      if (!best || (day+t) < (best.day+best.time)) best = {med:m, day, time:t}; }
  }
  return best;
}
function medBadge(m){
  if (m.status==='upcoming') return `<span class="badge grey">From ${fmtShort(m.start)}</span>`;
  if (m.status==='history') return `<span class="badge grey">Completed</span>`;
  const n = nowHM(), k = today();
  const todayLeft = m.times.some(t => t > n && !D().taken[takenKey(m,k,t)]);
  return todayLeft ? `<span class="badge">Today</span>` : `<span class="badge grey">Tomorrow</span>`;
}
ROUTES.meds = r => {
  const tab = r.q.get('t') || 'current';
  const list = D().meds.filter(m=>m.status===tab);
  const nd = nextDose();
  return {tab:'home', body:`
    ${header('Medication')}
    <div class="mint-hero"><div class="circle">${icon('pill',40,'#2F7D6B',1.6)}</div>
      <div><h3>Your Medications</h3><p>Take your medicine on time for a healthier you</p></div></div>
    <div class="seg">${[['current','Current'],['upcoming','Upcoming'],['history','History']].map(([k,l])=>`<button class="chip ${k===tab?'on':''}" onclick="go('meds?t=${k}')">${l}</button>`).join('')}</div>
    <div style="margin-top:12px">${list.length ? list.map(m=>`
      <button class="card" style="padding:16px" onclick="medSheet('${m.id}')"><div class="row">
        <div class="ava">${icon('pill',24,'#4A9F8C',1.6)}</div>
        <div class="grow"><div class="row" style="gap:6px"><b class="grow" style="font-size:14px">${esc(m.name)}</b>${medBadge(m)}</div>
        <div class="small muted" style="margin-top:5px">${esc(m.dose)} • ${esc(m.when)}</div>
        <div class="small" style="margin-top:5px;font-weight:600">${esc(m.freq)} · ${m.times.join(', ')}</div></div>${icon('chev',18,'#888')}</div></button>`).join('')
      : '<div class="empty">Nothing here.</div>'}</div>
    ${tab==='current' && nd ? `<button class="card" style="background:var(--mint);border:none;padding:18px" onclick="medSheet('${nd.med.id}')"><div class="row">
      ${icon('bell',22,'#2F7D6B')}<div class="grow"><b style="font-size:14px">Next dose</b><div class="small" style="margin-top:3px">${relDay(nd.day)}, ${fmtTime(nd.time)} — ${esc(nd.med.name)}</div></div>${icon('chev',18,'#4A9F8C')}</div></button>`:''}
    ${tab==='current' && !nd && list.length ? `<div class="card" style="background:var(--mint-soft);border:none;text-align:center;font-size:14px">${icon('check',18,'#2F7D6B')} All doses for today and tomorrow are taken</div>`:''}`};
};
window.medSheet = id => {
  const m = D().meds.find(x=>x.id===id), k = today();
  const doses = m.times.map(t => { const key = takenKey(m,k,t), done = !!D().taken[key];
    return `<label class="switch"><span>${icon('clock',16,'#888')} ${fmtTime(t)} ${done?'<span class="badge" style="margin-left:6px">Taken</span>':''}</span>
      <input type="checkbox" ${done?'checked':''} onchange="toggleDose('${key}',this.checked,'${m.id}')" aria-label="Taken at ${t}"></label>`; }).join('');
  sheet(`<div class="row"><div class="ava">${icon('pill',24,'#4A9F8C',1.6)}</div><div><h3>${esc(m.name)}</h3><div class="small muted">${esc(m.dose)} • ${esc(m.when)}</div></div></div>
    <div class="kv" style="margin-top:12px"><span>Frequency</span><span>${esc(m.freq)}</span></div>
    <div class="kv"><span>Course</span><span>${fmtDay(m.start)} – ${fmtDay(m.end)}</span></div>
    ${m.status==='current' && k>=m.start && k<=m.end ? `<h2 style="font-size:15px;margin:16px 0 0">Today's doses</h2>${doses}` : ''}
    <p class="small muted" style="margin-top:14px">Do not change the dose without consulting your doctor.</p>
    <button class="btn btn-outline" style="margin-top:14px" onclick="closeSheet()">Close</button>`);
};
window.toggleDose = (key, v, id) => { if (v) D().taken[key] = Date.now(); else delete D().taken[key]; save(); render(); medSheet(id); toast(v?'Dose marked as taken':'Mark removed'); };

/* ============ S8 HOME VISIT ============ */
const BANNER = `<svg viewBox="0 0 340 140" width="100%" role="img" aria-label="Doctor visiting a patient at home">
  <rect width="340" height="140" fill="#BDF5D9"/>
  <path d="M30 30h40v-20h40v20h40v40h-40v60h-40v-60h-40z" fill="#2F6B5A" opacity=".85"/>
  <rect x="60" y="50" width="70" height="60" rx="6" fill="#F4EEDD"/>
  <rect x="68" y="80" width="34" height="22" rx="5" fill="#B5763A"/><circle cx="85" cy="70" r="7" fill="#C49C7A"/>
  <circle cx="114" cy="66" r="6" fill="#7a5a43"/><rect x="108" y="72" width="12" height="26" rx="4" fill="#2F7D6B"/>
  <rect x="40" y="112" width="110" height="16" rx="3" fill="#2F6B5A"/><text x="95" y="124" text-anchor="middle" font-size="9" font-family="Inter" fill="#fff" font-weight="600">Compassionate Care</text>
  <circle cx="262" cy="46" r="20" fill="#5b3a29"/><rect x="242" y="26" width="40" height="10" rx="5" fill="#222"/>
  <path d="M222 140c0-34 18-58 40-58s40 24 40 58z" fill="#fff"/><path d="M252 84l10 20 10-20" fill="#b9d8ee"/>
  <path d="M248 92c-6 16 4 28 14 28M276 92c6 16-4 28-14 28" stroke="#333" stroke-width="2.5" fill="none"/><circle cx="262" cy="121" r="4" fill="#666"/>
</svg>`;
ROUTES.visits = () => {
  const n = today();
  const vs = D().visits.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const up = vs.filter(v => v.date >= n && v.status!=='Cancelled' && v.status!=='Completed');
  const past = vs.filter(v => !up.includes(v)).reverse();
  const badge = s => `<span class="badge ${s==='Pending'?'warn':s==='Cancelled'?'red':s==='Completed'?'grey':''}">${s}</span>`;
  const card = v => { const d = doc(v.doctorId); return `<button class="card" onclick="visitSheet('${v.id}')"><div class="row" style="align-items:flex-start">
    <div class="ava" style="width:44px;height:44px">${icon('home',22,'#4A9F8C',1.6)}</div>
    <div class="grow"><div class="row" style="gap:6px"><b class="grow" style="font-size:14px">${fmtDay(v.date)}</b>${badge(v.status)}</div>
    <div class="small muted" style="margin-top:3px">${fmtTime(v.from)} - ${fmtTime(v.to)}</div>
    <div style="font-size:14px;margin-top:8px">${esc(d.name)}</div><div class="small muted">${esc(d.spec)}</div></div></div></button>`; };
  return {tab:'home', body:`
    ${header('Home Visit')}
    <div class="banner">${BANNER}</div>
    <button class="btn btn-primary" style="margin-top:16px" onclick="go('visitnew')">${icon('plus',18,'#fff',2.4)} Request a home visit</button>
    <h2>Upcoming Visits</h2>${up.length?up.map(card).join(''):'<div class="empty">No upcoming visits.</div>'}
    <h2>Past Visits</h2>${past.length?past.map(card).join(''):'<div class="empty">No past visits.</div>'}`};
};
window.visitSheet = id => {
  const v = D().visits.find(x=>x.id===id), d = doc(v.doctorId);
  const canCancel = v.status==='Pending' || v.status==='Confirmed';
  sheet(`<h3>Home visit</h3><div class="small muted">${fmtDay(v.date)} · ${fmtTime(v.from)} - ${fmtTime(v.to)}</div>
    <div class="kv" style="margin-top:10px"><span>Doctor</span><span>${esc(d.name)}</span></div>
    <div class="kv"><span>Specialty</span><span>${esc(d.spec)}</span></div>
    <div class="kv"><span>Address</span><span>${esc(v.address)}</span></div>
    <div class="kv"><span>Reason</span><span>${esc(v.reason||'—')}</span></div>
    <div class="kv"><span>Status</span><span>${esc(v.status)}</span></div>
    ${canCancel?`<button class="btn btn-danger" style="margin-top:18px" onclick="confirmBox('Cancel home visit?','The doctor will be notified.','Yes, cancel',()=>{const x=D().visits.find(y=>y.id==='${v.id}');x.status='Cancelled';save();render();toast('Visit cancelled')})">Cancel visit</button>`:''}
    <button class="btn btn-outline" style="margin-top:10px" onclick="closeSheet()">Close</button>`);
};
ROUTES.visitnew = () => {
  const u = me(), min = dayKey(addDays(new Date(),1));
  return {tab:'home', body:`${header('Request Visit','visits')}
    <form id="vForm" novalidate>
      <label class="f" for="vdoc">Doctor</label>
      <select class="input" id="vdoc">${DOCTORS.map(d=>`<option value="${d.id}">${esc(d.name)} — ${esc(d.spec)}</option>`).join('')}</select>
      <label class="f" for="vdate">Date</label><input class="input" id="vdate" type="date" min="${min}" value="${min}"><div class="err-msg" id="vdateErr"></div>
      <label class="f" for="vtime">Time window</label>
      <select class="input" id="vtime">${['09:00-10:00','11:00-12:00','14:00-15:00','16:00-17:00','18:00-19:00'].map(t=>`<option>${t}</option>`).join('')}</select>
      <label class="f" for="vaddr">Address</label><input class="input" id="vaddr" value="${esc(u.address)}" placeholder="City, street, building, apartment"><div class="err-msg" id="vaddrErr"></div>
      <label class="f" for="vreason">Symptoms / reason</label><textarea class="input" id="vreason" maxlength="300" placeholder="Briefly describe how you feel"></textarea><div class="err-msg" id="vreasonErr"></div>
      <button class="btn btn-primary" style="margin-top:22px">Send request</button>
    </form>`, after(){
    document.getElementById('vForm').onsubmit = e => {
      e.preventDefault(); const v = id => document.getElementById(id).value.trim();
      let ok = setErr('vdate', !v('vdate') || v('vdate') < min ? 'Choose a date starting tomorrow' : '');
      ok = setErr('vaddr', v('vaddr').length < 5 ? 'Enter your full address' : '') && ok;
      ok = setErr('vreason', v('vreason').length < 3 ? 'Describe the reason for the visit' : '') && ok;
      if (!ok) return;
      const [from, to] = v('vtime').split('-');
      const visit = {id:uid(), doctorId:v('vdoc'), date:v('vdate'), from, to, status:'Pending', address:v('vaddr'), reason:v('vreason')};
      D().visits.push(visit); save(); go('visits'); toast('Request sent. The clinic will confirm it soon.');
      // simulate clinic confirmation
      setTimeout(() => { load(); const x = S.data[S.session]?.visits.find(y=>y.id===visit.id); if (x && x.status==='Pending') { x.status='Confirmed'; save(); render(); toast('Your home visit was confirmed'); } }, 6000);
    };
  }};
};

/* ============ START ============ */
load(); render();
</script>
</body>
</html>
